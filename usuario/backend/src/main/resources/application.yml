# Sin secretos: los valores llegan por variables de entorno o por application-local.yml (fuera de git).
# Ver application-example.yml.
server:
  port: 8080
  tomcat:
    # Permite responder con un error JSON a una foto demasiado grande, en vez de cortar la conexión.
    max-swallow-size: 50MB

spring:
  application:
    name: palacetec-usuario
  servlet:
    multipart:
      # El límite de la foto (2 MB) lo revisa AvatarImages, con el mensaje de Django.
      max-file-size: 10MB
      max-request-size: 11MB
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # Sin esto, un error de PostgreSQL escribe en el log la fila completa (correo, DNI).
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo administran las migraciones de Django: aquí solo se valida.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true

# Las claves vacías se rechazan al arrancar (PalaceTecProperties).
palacetec:
  jwt:
    secret: ${JWT_SECRET:}
    # Igual que AUTH_SESSION_LIFETIME de Django. Formato Duration: 8h, 30m...
    expiration: ${JWT_EXPIRATION:8h}
  # Debe ser la misma clave que usa Django (EXCLUSION_HMAC_KEY o, si no existe, SECRET_KEY).
  exclusion-hmac-key: ${EXCLUSION_HMAC_KEY:}
  # Django sirve las portadas de los juegos.
  media-base-url: ${MEDIA_BASE_URL:http://localhost:8000}
  # Orígenes del frontend React del jugador: CORS con cookies y CSRF.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  web:
    # true cuando el sitio se sirva por HTTPS. Equivale a DEBUG=False en Django.
    cookie-secure: ${COOKIE_SECURE:false}
    # LOGIN_RATE_LIMIT de Django: solicitudes por minuto y por IP.
    login-rate-limit: ${LOGIN_RATE_LIMIT:30}
    # Frontend React al que apuntan los enlaces de los correos.
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    # Carpeta media de Django (relativa a usuario/backend): avatar_url es común a los dos backends.
    media-root: ${MEDIA_ROOT:../../administracion/backend/media}
  # WebSockets ws/roulette/<sala>/ y ws/notifications/: cada cuánto se leen de la base los cambios de runroulette.
  realtime:
    polling: true
    poll-interval-ms: ${REALTIME_POLL_MS:1000}
  # Asistente virtual, con las variables de Django. Sin clave responde con preguntas frecuentes.
  assistant:
    provider: ${ASSISTANT_PROVIDER:faq}
    api-key: ${ASSISTANT_API_KEY:}
    model: ${ASSISTANT_MODEL:}
    base-url: ${ASSISTANT_BASE_URL:}
    timeout: ${ASSISTANT_TIMEOUT:10}
    rate-limit: 20
