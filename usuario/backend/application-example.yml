# Copia este archivo como application-local.yml (no se sube a git) y completa los valores.
# También puedes definir las mismas claves como variables de entorno, que tienen prioridad.
DB_URL: jdbc:postgresql://localhost:5432/palacetec
DB_USER: postgres
DB_PASSWORD: replace_with_your_local_password
# Al menos 32 caracteres aleatorios. No reutilices la SECRET_KEY de Django.
JWT_SECRET: replace_with_a_random_secret_of_32_or_more_characters
JWT_EXPIRATION: 8h
# La misma clave que Django: EXCLUSION_HMAC_KEY de administracion/backend/.env o, si no existe, su SECRET_KEY.
EXCLUSION_HMAC_KEY: replace_with_the_same_key_used_by_django
# Opcionales de la sesión web (estos son los valores por defecto).
# COOKIE_SECURE: false
# FRONTEND_URL: http://localhost:5173
# MEDIA_ROOT: ../../administracion/backend/media
# Opcionales del asistente virtual, con los nombres de Django: faq (por defecto), gemini u openai. Sin clave siempre
# responde con las preguntas frecuentes. La clave va solo en application-local.yml o en una variable de entorno.
# ASSISTANT_PROVIDER: gemini
# ASSISTANT_API_KEY: replace_with_your_own_key
# ASSISTANT_MODEL: gemini-3.6-flash
# ASSISTANT_TIMEOUT: 10
